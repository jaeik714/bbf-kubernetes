apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-sleep
  namespace: default
spec:
  type: Python
  mode: cluster
  image: "spark:3.5.2"
  imagePullPolicy: IfNotPresent
  # 파이썬 코드를 직접 명령어로 칩니다 (3600초 동안 대기)
  mainApplicationFile: "local:///opt/spark/examples/src/main/python/pi.py"
  arguments:
    - "1000" # 계산 횟수를 엄청 늘려서 시간을 끄는 꼼수입니다
  sparkVersion: "3.5.2"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: "512m"
    serviceAccount: spark
  executor:
    cores: 1
    instances: 1
    memory: "512m"